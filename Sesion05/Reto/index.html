<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Registro de la bilbioteca</h1>
        <form action="#" class="Formulario">
            <fieldset>
                <legend>Datos personales</legend>
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="campo">
                    <label for="documento">Documento</label>
                    <input type="texto" id="documento" name="documento" required>
                </div>
                <div class="campo">
                    <label for="correo">Correo electronico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div class="campo">
                    <label for="nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="nacimiento" name="nacimiento" min="1900-01-01" max="2026-12-31">
                </div>
                    <div class="campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" required minlength="
                    8" >
                </div>
                <div class="campo">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" min="0" max="120">
                </div>
            </fieldset>
            <fieldset>
                <legend>Tu perfil</legend>
                <div class="campo">
                    <label for="tipo">Tipo de usuario</label>
                    <select name="tipo" id="tipo" required>
                        <option value="">Elije una opcion</option>
                        <option value="aprendiz">Aprendiz</option>
                        <option value="instructor">Instructor</option>
                        <option value="visitante">Visitante</option>
                    </select>
                </div>

                <fieldset class="grupo">
                    <legend>Sede</legend>
                    <label for="norte" class="opcion">
                        <input type="radio" name="sede" id="norte" value="norte" checked>Norte
                    </label>
                    <label for="centro" class="opcion">
                        <input type="radio" name="sede" id="centro" value="centro">Centro
                    </label>
                    <label for="sur" class="opcion">
                        <input type="radio" name="sede" id="sur" value="sur">Sur
                    </label>
                </fieldset>

                <fieldset class="grupo">
                    <legend>Temas que te interesan</legend>
                    <label for="" class="opcion">
                        <input type="checkbox" name="temas" id="" value="novelas">Novelas
                    </label>
                    <label for="" class="opcion">
                        <input type="checkbox" name="temas" id="" value="ciencia">Ciencia
                    </label>
                    <label for="" class="opcion">
                        <input type="checkbox" name="temas" id="" value="tecnologia">Tecnología
                    </label>
                </fieldset>

                <div class="campo">
                    <label for="comentario">¿Que libro te gustaría que tuvieramos?</label>
                    <textarea name="comentario" id="comentario" rows="4"></textarea>
                </div>
            </fieldset>
            <button type="submit" class="boton">Registrarme</button>
        </form>
    </main>
</body>
</html>
