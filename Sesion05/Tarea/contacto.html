    <main>

            <center>
            <h2>Contactanos</h2>

                <caption>Enlaces</caption>

                <tbody>

<!-- Punto 4: Comentario explicativo del atributo name -->
<!-- 
  El atributo 'name' sirve para identificar y etiquetar el dato ingresado en cada campo 
  al momento de enviar el formulario al servidor o procesarlo con un script backend (ej. name="nombre" envía nombre=ValorIngresado). 
-->

        <h2>Formulario de contacto</h2>
        <fieldset>
        <form action="formularioContacto">
            <legend>Datos de contacto</legend>
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="50" placeholder="Ingresa tu nombre">
                <small id="error-nombre" class="error"></small>
            </div>
            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required placeholder="Ingresa tu correo">
                <small id="error-correo" class="error"></small>
            </div>
            <div class="campo">
                <label for="celular">Celular</label>
                <input type="tel" id="celular" name="celular" placeholder="Ingresa tu numero">
                <small id="error-celular" class="error"></small>
            </div>
            <div class="campo">
                <label for="motivo">Seleccione el motivo</label>
                <select name="motivo" id="motivo" required>
                    <option value="">Seleccione una opción</option>
                    <option value="pedido">Pedido</option>
                    <option value="pregunta">Pregunta</option>
                    <option value="queja">Queja</option>
                </select>
                <small id="error-motivo" class="error"></small>
            </div>
            <div class="campo">
                <label for="comentario">Ingresa detalles del motivo</label>
                <textarea name="comentario" id="comentario" rows="7" required></textarea>
            </div>
            <button type="submit" class="boton">Enviar</button>
        </form>
        </fieldset>
    </main>
    <footer>
        <p>Barber Sto Domingo - Calle 80 # 45-12</p>
        <p><img src="img/Wpp.png" alt="whatsapp" width="40">Contactanos por whatsapp</p>
    </footer>
</body>
</html>
